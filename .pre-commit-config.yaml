repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.2.0
  hooks:
  - id: end-of-file-fixer
  - id: check-yaml

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint-system

- repo: local
  hooks:
  - id: format
    name: Format nix code
    language: system
    pass_filenames: false
    entry: nix fmt

  - id: linting
    name: Lint nix code
    language: system
    pass_filenames: false
    entry: nix run .#linting
