name: Flake Check

'on':
  push:
    branches:
    - master
  pull_request:
    branches: [master]
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [updater-tests, check, discover, builds]
    # Run even if a prerequisite fails or is skipped; a skipped gate must not
    # accidentally satisfy the branch ruleset's required status check.
    if: ${{ always() }}
    steps:
    - name: Require every CI job to succeed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        results = json.loads(os.environ["RESULTS"])
        print(f"CI job results: {results}")
        sys.exit(0 if results and all(result == "success" for result in results) else 1)
        PY

  updater-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Test update PR lifecycle
      run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  check:
    strategy:
      matrix:
        runner: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: experimental-features = flakes nix-command pipe-operators

    - name: Check flake
      run: nix -Lv flake check

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: experimental-features = flakes nix-command pipe-operators
    - id: set
      run: |
        matrix=$(nix eval --impure --json --expr "import .github/workflows/package-runner-matrix.nix")
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  builds:
    needs: discover
    strategy:
      matrix:
        build: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.build.runner }}

    steps:
    - uses: actions/checkout@v6
    - uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: experimental-features = flakes nix-command pipe-operators

    - name: Build package
      run: NIXPKGS_ALLOW_UNFREE=1 nix build --impure .#${{ matrix.build.package }}
