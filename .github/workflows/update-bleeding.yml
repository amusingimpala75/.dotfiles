name: Flake bleeding update

'on':
  workflow_dispatch: { }
  push:
    branches: [master]
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

jobs:
  update:
    uses: ./.github/workflows/update-pr.yml
    with:
      track: bleeding
      refresh-only: ${{ github.event_name == 'push' }}
    secrets:
      app-id: ${{ secrets.FLAKE_UPDATE_APP_ID }}
      app-private-key: ${{ secrets.FLAKE_UPDATE_APP_PRIVATE_KEY }}
